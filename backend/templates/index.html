<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTHING GLYPH REMOTE</title>
    <!-- Use DotGothic16 for the Nothing Dot Matrix look and Space Grotesk for body -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-hover: rgba(255, 255, 255, 0.2);
            --border-color: rgba(255, 255, 255, 0.2);
            --glow-color: rgba(255, 255, 255, 0.8);
            --red-accent: #ff3b30;
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #000000;
            --accent-color: #000000;
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-hover: rgba(0, 0, 0, 0.1);
            --border-color: rgba(0, 0, 0, 0.2);
            --glow-color: rgba(0, 0, 0, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, color 0.3s;
        }

        h1, h2, .dot-font {
            font-family: 'DotGothic16', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 20px auto;
            position: relative;
            display: none; /* hidden until login */
        }
        
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .input-field {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            width: 100%;
            margin-bottom: 15px;
            border-radius: 4px;
            font-family: 'Space Grotesk', sans-serif;
            box-sizing: border-box;
        }

        .btn {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'DotGothic16', monospace;
            text-transform: uppercase;
            width: 100%;
        }
        
        .btn:hover { background: var(--btn-hover); }
        .btn-full { grid-column: span 2; }
        
        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'DotGothic16', monospace;
        }

        .phone-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .phone-img {
            width: 100%;
            display: block;
            /* Invert phone image for light theme so it remains visible */
            filter: var(--invert-img, none);
            transition: filter 0.3s;
        }
        
        [data-theme="light"] .phone-img {
            --invert-img: invert(1);
        }

        .glyph-zone {
            position: absolute;
            background: rgba(255, 255, 255, 0);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .glyph-zone:hover {
            border: 1px dashed var(--border-color);
        }
        
        .glyph-zone.active {
            background: var(--glow-color);
            box-shadow: 0 0 15px var(--glow-color);
        }

        /* Adjusted Placements */
        #zone-A1 { top: 12%; right: 28%; width: 6%; height: 16%; transform: rotate(40deg); border-radius: 10px; }
        #zone-B1 { top: 22%; right: 18%; width: 14%; height: 14%; border-radius: 50%; }
        #zone-C  { top: 38%; left: 32%; width: 44%; height: 23%; border-radius: 50%; }
        #zone-D1 { bottom: 18%; left: 47.5%; width: 5%; height: 16%; border-radius: 20px; }
        
        #zone-E1 { bottom: 25%; right: 20%; width: 6%; height: 4%; border-radius: 50%; }
        #zone-E1.active {
            background: var(--red-accent);
            box-shadow: 0 0 15px var(--red-accent);
        }

        .controls {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .slider-label {
            font-family: 'DotGothic16', monospace;
            font-size: 14px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--text-color);
            cursor: pointer;
            margin-top: -6px;
        }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--border-color);
            border-radius: 2px;
        }

    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h1 style="margin-bottom: 30px; font-size: 32px;">NOTHING</h1>
        <p style="margin-bottom: 20px;" class="dot-font">AUTHENTICATION REQUIRED</p>
        <input type="text" id="username" class="input-field" placeholder="Username">
        <input type="password" id="password" class="input-field" placeholder="Password">
        <button class="btn" onclick="login()">LOGIN</button>
        <p id="login-err" style="color: var(--red-accent); display: none; font-size: 12px; margin-top: 10px;">INVALID CREDENTIALS</p>
    </div>

    <!-- MAIN APP -->
    <div class="container" id="main-app">
        <div class="header-bar">
            <h1>GLYPH</h1>
            <button class="theme-toggle" onclick="toggleTheme()">INVERT</button>
        </div>

        <div class="phone-container">
            <img src="/static/phone.png" class="phone-img" alt="Nothing Phone (1)">
            <div id="zone-A1" class="glyph-zone" onclick="toggleZone('A1')"></div>
            <div id="zone-B1" class="glyph-zone" onclick="toggleZone('B1')"></div>
            <div id="zone-C"  class="glyph-zone" onclick="toggleZone('C')"></div>
            <div id="zone-D1" class="glyph-zone" onclick="toggleZone('D1')"></div>
            <div id="zone-E1" class="glyph-zone" onclick="toggleZone('E1')"></div>
        </div>

        <div class="controls">
            <div class="slider-container">
                <div style="display:flex; justify-content:space-between;">
                    <span class="slider-label">D1 PROGRESS</span>
                    <span class="slider-label" id="progress-val">0%</span>
                </div>
                <input type="range" id="d1-slider" min="0" max="100" value="0" oninput="updateProgress(this.value)" onchange="sendState()">
            </div>
            <button class="btn" onclick="turnOffAll()">TURN OFF ALL</button>
        </div>
    </div>
    
    <script>
        // State
        const state = {
            active_zones: [],
            progress: 0
        };

        // Login Logic
        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === 'karanrana' && p === 'karanrana') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
            } else {
                document.getElementById('login-err').style.display = 'block';
            }
        }

        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'light') {
                html.removeAttribute('data-theme');
            } else {
                html.setAttribute('data-theme', 'light');
            }
        }

        // LED Interaction Logic
        function toggleZone(zoneId) {
            const el = document.getElementById('zone-' + zoneId);
            const index = state.active_zones.indexOf(zoneId);
            
            if (index > -1) {
                // Turn off
                state.active_zones.splice(index, 1);
                el.classList.remove('active');
            } else {
                // Turn on
                state.active_zones.push(zoneId);
                el.classList.add('active');
            }
            
            // If D1 is toggled manually via image click, set progress to 100 or 0
            if (zoneId === 'D1') {
                if (index > -1) {
                    state.progress = 0;
                    document.getElementById('d1-slider').value = 0;
                    document.getElementById('progress-val').innerText = '0%';
                } else {
                    state.progress = 100;
                    document.getElementById('d1-slider').value = 100;
                    document.getElementById('progress-val').innerText = '100%';
                }
            }
            
            sendState();
        }
        
        function updateProgress(val) {
            state.progress = parseInt(val);
            document.getElementById('progress-val').innerText = val + '%';
            const d1El = document.getElementById('zone-D1');
            
            if (state.progress > 0) {
                if (!state.active_zones.includes('D1')) {
                    state.active_zones.push('D1');
                }
                d1El.classList.add('active');
                // Adjust opacity of the D1 zone visually based on progress
                d1El.style.opacity = Math.max(0.2, state.progress / 100);
            } else {
                const idx = state.active_zones.indexOf('D1');
                if (idx > -1) state.active_zones.splice(idx, 1);
                d1El.classList.remove('active');
                d1El.style.opacity = 1; // reset
            }
        }
        
        function turnOffAll() {
            state.active_zones = [];
            state.progress = 0;
            document.getElementById('d1-slider').value = 0;
            document.getElementById('progress-val').innerText = '0%';
            
            document.querySelectorAll('.glyph-zone').forEach(el => {
                el.classList.remove('active');
                el.style.opacity = 1;
            });
            
            sendState();
        }

        function sendState() {
            fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(state)
            }).catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
